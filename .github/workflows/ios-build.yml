name: iOS Cloud Build (No Mac Required)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test-ios:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OutcomeCore Swift unit tests
        working-directory: ios
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app archive
        working-directory: ios
        run: |
          xcodebuild \
            -project Outcome.xcodeproj \
            -scheme Outcome \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned .ipa for SideStore / AltStore
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Outcome.app Payload/Outcome.app
          zip -r Outcome-unsigned.ipa Payload

      - name: Upload Outcome-unsigned.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Outcome-unsigned-ipa
          path: ios/Outcome-unsigned.ipa
          retention-days: 30
